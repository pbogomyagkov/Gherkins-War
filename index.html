<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101812">
    <title>Gherkins War</title>
    <link rel="icon" href="assets/fav.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game" aria-label="Gherkins War mobile game">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">🥒</span>
                <div>
                    <h1>Gherkins War</h1>
                    <p>Mobile field</p>
                </div>
            </div>
            <div class="field-label"><span class="live-dot"></span><span id="field-size">8 × 16</span></div>
        </header>

        <section class="arena" aria-label="Game field">
            <div id="field" class="field" role="grid" aria-label="Game map"></div>
        </section>

        <div class="controls" aria-label="Game controls">
            <div class="control-group">
                <span class="control-caption">MOVE</span>
                <div class="joystick" id="joystick" aria-label="Movement joystick" role="application">
                    <div class="stick-ring"></div>
                    <div class="stick-knob" id="stick-knob"></div>
                </div>
            </div>

            <div class="control-group">
                <span class="control-caption">AIM / FIRE</span>
                <div class="aim-pad" aria-label="Aim and fire controls">
                    <button class="aim-direction aim-up" data-direction="u" aria-label="Aim up">▲</button>
                    <button class="aim-direction aim-right" data-direction="r" aria-label="Aim right">▶</button>
                    <button class="aim-direction aim-down" data-direction="d" aria-label="Aim down">▼</button>
                    <button class="aim-direction aim-left" data-direction="l" aria-label="Aim left">◀</button>
                    <button class="fire-button" id="fire-button" aria-label="Fire">FIRE</button>
                </div>
            </div>
        </div>
    </main>
    <script src="game.js"></script>
</body>
</html>
